# Spring Boot Application Configuration
spring.application.name=verificador-disponibilidad-api
server.port=8080

# Logging Configuration
logging.level.root=INFO
logging.level.com.VerificadorDisponibilidad=DEBUG

# OpenAPI / Swagger Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# API Documentation
springdoc.swagger-ui.title=Verificador Agenda de Disponibilidad API
springdoc.swagger-ui.description=API REST para verificar disponibilidad de empleados y equipos para cubrir turnos
springdoc.swagger-ui.version=1.0.0
springdoc.swagger-ui.contact.name=Development Team
springdoc.swagger-ui.contact.url=https://github.com

# Jackson Configuration
spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=non_null

# Management Endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
